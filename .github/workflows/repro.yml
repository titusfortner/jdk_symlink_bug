name: JDK classes.jsa symlink crash repro

# Reproduction for an EXCEPTION_ACCESS_VIOLATION in jvm.dll on Windows when the
# default CDS archive (bin\server\classes.jsa) is a symbolic link instead of a
# regular file. First hit under Bazel (rules_java ships Azul Zulu), whose
# runfiles tree materializes the JDK as symlinks. Bazel is NOT required here:
# repro.ps1 reproduces it with a plain JDK + a symlink.
#
# The single source of truth is repro.ps1. A run is only counted as a CRASH when
# a real access violation (hs_err with EXCEPTION_ACCESS_VIOLATION) is written, so
# a clean "-Xshare:on cannot map archive" abort is never misreported as the bug.

on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        distribution: ["temurin", "zulu", "microsoft"]
        java: ["21", "25"]
    name: "${{ matrix.distribution }} ${{ matrix.java }}"
    steps:
      - uses: actions/checkout@v4

      - name: Set up ${{ matrix.distribution }} JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}

      - name: Run repro
        shell: pwsh
        run: ./repro.ps1 -OutDir "C:\cds-repro"

      - name: Upload crash artifacts (hs_err + minidump + results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdk-cds-symlink-${{ matrix.distribution }}-${{ matrix.java }}
          path: |
            C:\cds-repro\hs_err_*.log
            C:\cds-repro\*.mdmp
            C:\cds-repro\results.json
            C:\cds-repro\*.txt
          if-no-files-found: warn
